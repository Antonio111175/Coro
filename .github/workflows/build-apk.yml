name: Crea APK Coro V17

on:
  workflow_dispatch:
  push:
    branches:
      - principale
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Estrai progetto Coro V17
        run: |
          mkdir progetto
          unzip -q Coro_V17_Android.zip -d progetto

      - name: Trova progetto Android
        run: |
          find progetto -name "settings.gradle*" -o -name "build.gradle*"

      - name: Compila APK
        run: |
          PROJECT_DIR=$(dirname "$(find progetto -name settings.gradle -o -name settings.gradle.kts | head -n 1)")
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: Coro-V17-APK
          path: |
            progetto/**/build/outputs/apk/debug/*.apk
